name: Build TWRP for EEBBK A7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  twrp:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE: ums512_1h10
      LUNCH: omni_ums512_1h10-userdebug
      TREE_PATH: device/eebbk/ums512_1h10

    steps:
      - name: Checkout device tree repo
        uses: actions/checkout@v4

      - name: Free disk space for AOSP build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          sudo dpkg --add-architecture i386
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y git gnupg ccache automake autoconf m4 bison flex gperf \
            unzip zip bzip2 rsync curl wget python3 python-is-python3 \
            openjdk-17-jdk build-essential zlib1g-dev lib32z1-dev libxml2-utils \
            libgl1-mesa-dev libncurses5-dev gawk diff patch file schedtool || \
          sudo apt-get -qq install -y git ccache build-essential openjdk-17-jdk python3 || true
          df -h /
          java -version

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -sSL https://raw.githubusercontent.com/GerritCodeReview/git-repo/main/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync TWRP source (minimal manifest)
        run: |
          mkdir -p $HOME/twrp
          cd $HOME/twrp
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u $MANIFEST_URL -b $MANIFEST_BRANCH \
            -g default,-mips,-darwin,-notdefault
          repo sync -c --no-tags --optimized-fetch --prune --force-sync -j4
          df -h $HOME

      - name: Place device tree
        run: |
          cd $HOME/twrp
          mkdir -p device/eebbk
          cp -rT $GITHUB_WORKSPACE/$TREE_PATH device/eebbk/$DEVICE
          ls -la device/eebbk/$DEVICE

      - name: Create vendor/omni stub (not shipped by minimal AOSP manifest)
        run: |
          cd $HOME/twrp
          mkdir -p vendor/omni/config
          cat > vendor/omni/config/common.mk <<'EOF'
          # Stub for minimal-manifest TWRP build.
          # Real vendor/omni adds apps/extras we do not need in a recovery image.
          # TWRP itself is provided by bootable/recovery in this manifest.
          EOF
          echo "stub created:"; ls -la vendor/omni/config/

      - name: Build recoveryimage
        run: |
          cd $HOME/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
          export BUILD_BROKEN_DUP_RULES=true
          export BUILD_BROKEN_ELF_PREBUILT_PRODUCT_COPY_FILES=true
          export SKIP_API_CHECKS=true
          export USE_CCACHE=1
          source build/envsetup.sh
          lunch $LUNCH
          set +e
          make -j$(nproc) recoveryimage 2>&1 | tee $HOME/build.log
          RC=${PIPESTATUS[0]}
          if [ $RC -ne 0 ] || [ ! -f out/target/product/$DEVICE/recovery.img ]; then
            echo "=== retry with: m twrp ==="
            make -j$(nproc) twrp 2>&1 | tee -a $HOME/build.log
          fi
          echo "=== image search ==="
          find out/target/product/$DEVICE -maxdepth 1 \( -name "*.img" -o -name "*.zip" \) -exec ls -lh {} \; 2>/dev/null
          cp -f out/target/product/$DEVICE/recovery.img $GITHUB_WORKSPACE/recovery.img

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-ums512-1h10
          path: recovery.img
          if-no-files-found: error
          retention-days: 30
